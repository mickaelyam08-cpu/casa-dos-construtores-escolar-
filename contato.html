
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa de Construtores</title>
    <style>
  *, *::before, *::after { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }
  html { 
    -webkit-text-size-adjust: 100%;
   }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #fafaf8;
    color: #222;
    line-height: 1.7;
    overflow-wrap: break-word;
  }


  /* Cabeçalho */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 24px;
    padding: 20px;
    background: #1c1c1c;
  }
  .logo {
    color: #c8ff00;
    letter-spacing: 4px;
    font-size: 15px;
    text-transform: uppercase;
  }
  nav { 
     margin-left: auto;
     display: flex; 
     flex-wrap: wrap; 
     gap: 4px 28px; }
  nav a {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform:uppercase;
    padding: 10px 0;
  }
  nav a:hover {   
    color: #71881d;
   }

  .btnO {
    display: inline-block;
    margin-top: 16px;
    padding: 14px 32px;
    background: #1c1c1c;
    color: #c8ff00;
    text-decoration: none;
    letter-spacing: 2px;
    border-radius: 4px;
    border: 0;
    font: inherit;
    cursor: pointer;
  }
  .btnO:hover { 
    background: #000;
   }
   .box {
  box-sizing: border-box;      /* padding e borda entram dentro dos 500px */
  width: 100%;
  max-width: 500px;
  margin: 35px auto;           /* centraliza na horizontal */
  padding: 40px 48px;
  background: #fff;
  border: 1px solid #e6e6e1;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
}


form { 
  display: flex;
  flex-direction: column; 
  gap: 8px; 
}
label {
  display: block;
  font-size: 18px;
  font-weight: bold;
  margin-top: 8px;
}
input[type="text"], input[type="email"], input[type="tel"], select {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  font: inherit;
  font-size: 16px; /* evita zoom automático no iPhone */
  color: #222;
  background: #fff;
  border: 1px solid #cfcfc9;
  border-radius: 6px;
}
select { 
  cursor: pointer; 
  text-overflow: ellipsis; 
}
form .btnO { 
  width: 100%; 
  margin-top: 20px; 
  min-height: 48px; 
}
textarea {
  resize: none;
}

@media (min-width: 601px) {
  form .btnO { 
    width: auto;
    align-self: flex-start;
  }
 
}
@media (max-width: 600px) {
  nav { 
      margin-left: 0; 
      width: 100%;
     }
  }
</style>
</head>
<body>
    <header>
  <div class="logo">Casa dos Construtores</div>
  <nav>
    <a href="sobre.html">Sobre nós</a>
    <a href="index.html">Início</a>
  </nav>
</header>

    
    <div class="box">
        <!-- Formulário unificado -->
        <form action="https://formsubmit.co/mickaelyam08@gmail.com" method="POST"> 

            <input type="hidden" name="_subject" value="Novo pedido de orçamento - Casa dos Construtores">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Nome Completo" name="nome" required>
            
            <label for="numero">CPF</label>
            <input type="text" inputmode="numeric" autocomplete="off" id="numero" name="numero"
            placeholder="Ex: 000.000.000-00" maxlength="14"
            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
            title="Digite o CPF no formato 000.000.000-00" required>

            <label for="telefone">Telefone</label>
            <input type="tel" autocomplete="tel" id="telefone" name="telefone"
            placeholder="Ex: (00) 00000-0000" maxlength="15"
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
            title="Digite no formato (00) 00000-0000" required>            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Ex: seuemail@dominio.com" autocomplete="email" required>
          
            <label for="texto">Mensagem</label>
            <textarea id="texto" name="texto" rows="4" placeholder="Descreva o problema ou o serviço que você precisa" required></textarea>

            <label for="servico">Que tipo de serviço deseja?</label>
            <select id="servico" name="servico" required>
              <option value="" disabled selected>Selecione um serviço</option>
              <option value="construcao">Construção de casas e imóveis</option>
              <option value="reformas">Reformas residenciais e comerciais</option>
              <option value="pedreiro">Serviços de pedreiro e ajudante</option>
              <option value="pintura">Serviços de pintura e acabamento</option>
              <option value="eletrica-hidraulica">Instalações elétricas e hidráulicas</option>
              <option value="encanamento">Serviços de encanamento</option>
              <option value="pisos">Instalação de pisos e revestimentos</option>
              <option value="telhados">Construção e manutenção de telhados</option>
              <option value="gesso">Gesso, drywall e forros</option>
              <option value="marcenaria">Serviços de marcenaria</option>
              <option value="jardinagem">Jardinagem e áreas externas</option>
              <option value="demolicao">Demolição e preparação de terrenos</option>
              <option value="manutencao">Manutenção e reparos em geral</option>
              <option value="outros">Outros serviços</option>
            </select>
            <button type="submit" class="btnO">Enviar</button>
        </form>
</div>
<script>
document.getElementById('numero').addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g, '').slice(0, 11);
  v = v.replace(/(\d{3})(\d)/, '$1.$2')
       .replace(/(\d{3})(\d)/, '$1.$2')
       .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  e.target.value = v;
});

document.getElementById('telefone').addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g, '').slice(0, 11);
  v = v.replace(/^(\d{2})(\d)/, '($1) $2')
       .replace(/(\d{5})(\d{1,4})$/, '$1-$2');
  e.target.value = v;
});
</script>
</body>
</html>
