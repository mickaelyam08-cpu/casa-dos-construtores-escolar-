<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Casa dos Construtores" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- chaminé -->
  <rect x="71" y="14" width="9" height="20" fill="#c8ff00"/>
  <!-- telhado -->
  <polyline points="6,48 50,9 94,48" fill="none" stroke="#c8ff00" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- estrutura do telhado (tesoura) -->
  <polyline points="25,46 50,25 75,46" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="50" y1="25" x2="50" y2="46" stroke="#ffffff" stroke-width="3"/>
  <!-- paredes -->
  <polyline points="20,46 20,90 80,90 80,46" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="miter"/>
  <!-- viga e escoras -->
  <line x1="20" y1="46" x2="80" y2="46" stroke="#ffffff" stroke-width="3"/>
  <line x1="20" y1="46" x2="34" y2="60" stroke="#ffffff" stroke-width="3"/>
  <line x1="80" y1="46" x2="66" y2="60" stroke="#ffffff" stroke-width="3"/>
  <!-- porta -->
  <rect x="42" y="62" width="16" height="28" fill="#c8ff00"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
